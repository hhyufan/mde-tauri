<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MokiDown">
  <!--
    MokiDown 应用图标（矢量版）。

    M 的几何与整体配色由 512×512 原图实测得到：
      左竖 x 130-174（宽 44），笔画中心 x=152，底端圆角中心 y=334
      右竖 x 323-367（宽 44），笔画中心 x=345
      顶点 笔画中心 y=175（加圆头半径 23 后顶边正好落在实测的 y=152）
      V 底 实测 y=290~302 收拢，中心约 (248, 298)
      箭头 实测 y=314 最宽 309~381，向下收成尖端
      笔画宽取 46（与水平宽 44 按斜线倾角换算一致）
      左上 #1973fd 最暗、右上 #38c7fe 最亮、左下 #3a8cfd、右下 #3ab9fe

    光泽全部用椭圆的径向渐变表达：位置与扁率按原图亮度分布的实测摆放，
    因此有明确的亮区（不是平铺的雾），但没有直线边界——
    原图的波浪是柔和的弧面过渡，用路径填充会留下可见的直边。
  -->
  <defs>
    <linearGradient id="moki-bg" x1="0" y1="0.18" x2="1" y2="0.82">
      <stop offset="0" stop-color="#1973fd"/>
      <stop offset="0.5" stop-color="#1a8ffd"/>
      <stop offset="1" stop-color="#3cc4fe"/>
    </linearGradient>

    <!-- 斜向拉长的光斑：用椭圆把它压成"弧带"的走向，但没有硬边 -->
    <radialGradient id="moki-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moki-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moki-glow-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="moki-clip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#moki-clip)">
    <rect width="512" height="512" fill="url(#moki-bg)"/>

    <!--
      三片椭圆光斑，沿"自右上向左下"的方向排布，
      覆盖原图亮度图里成片的高亮区域。
    -->
    <ellipse cx="398" cy="88" rx="215" ry="150" fill="url(#moki-glow-a)"
             transform="rotate(-28 398 88)"/>
    <ellipse cx="300" cy="470" rx="245" ry="140" fill="url(#moki-glow-b)"
             transform="rotate(-16 300 470)"/>
    <ellipse cx="470" cy="330" rx="170" ry="150" fill="url(#moki-glow-c)"
             transform="rotate(-34 470 330)"/>
  </g>

  <!-- M：等宽笔画，端点与拐点均为圆角 -->
  <path d="M152 334 L152 175 L248 298 L345 175 L345 300"
        fill="none" stroke="#ffffff" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右竖末端的向下箭头 -->
  <path d="M307 310 L383 310 L345 342 Z" fill="#ffffff"/>
</svg>
