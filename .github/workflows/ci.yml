name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run version:sync
      - run: git diff --exit-code -- package.json package-lock.json src-tauri/Cargo.toml
      - run: npm run build
      - run: npm run check:bundle
      # 安装器的宣传页直接渲染应用的真实组件（installer/src/FeatureScenes.jsx 引
      # src/components/ui/FileTypeIcon、src/utils/mgtree 等），所以应用侧挪文件或改
      # 导出名会把安装器构建弄坏。这里构建一次，让它在 CI 就红，而不是等发版那次
      # Windows 构建跑到一半才炸。
      - run: npm run installer:build
      # 引真组件的代价是安装器包变大（主 chunk 172 kB → ~510 kB）。代价合理，但要有门看着。
      - run: npm run check:installer-bundle

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: npm run test:rust
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
