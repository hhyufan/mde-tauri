name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --legacy-peer-deps
      - run: npm run version:sync
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Configure Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            # 没有代码签名证书也允许发布：安装包依旧带 Tauri 的更新签名
            # （那个用于校验更新包完整性，是另一回事），只是 Windows 安装时会提示
            # "未知发布者"。把这两个 secret 配上就会自动启用签名。
            Write-Warning '未配置 WINDOWS_CERTIFICATE，本次以未签名状态发布。'
            Write-Output '::warning title=未配置代码签名证书::安装包将以未签名状态发布，Windows 会提示“未知发布者”。'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mokidown-code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item -LiteralPath $pfxPath -ErrorAction SilentlyContinue
          }
          if (!$certificate -or !$certificate.HasPrivateKey -or $certificate.NotAfter -le (Get-Date)) {
            throw 'The imported code-signing certificate is missing its private key or has expired.'
          }
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          if (!($certificate.EnhancedKeyUsageList | Where-Object { $_.Value -eq $codeSigningOid })) {
            throw 'The imported certificate is not valid for code signing.'
          }
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Compress -Depth 6
          "TAURI_CONFIG=$overlay" >> $env:GITHUB_ENV
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 必须显式传进来：createUpdaterArtifacts 会要求签名，
          # 只把私钥放进 GitHub Secrets 而不在这里引用，构建会以
          # "A public key has been found, but no private key" 失败。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: MokiDown v__VERSION__
          # 直接发布而不是留草稿：sync-oss 紧接着就会把它推到 OSS，
          # 若停在草稿状态会出现"Release 还没确认，客户端却能收到新版本"的错位。
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
      - name: Build React installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-react-installer.mjs --reuse-app
      - name: Sign React installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { exit 0 }
          $config = $env:TAURI_CONFIG | ConvertFrom-Json
          $thumbprint = $config.bundle.windows.certificateThumbprint
          if (!$thumbprint) { throw 'Missing Windows signing certificate thumbprint.' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'signtool.exe not found.' }
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/react' -Filter '*.exe' -File
          if (@($installer).Count -ne 1) { throw 'Expected one React installer.' }
          & $signTool.FullName sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'React installer signing failed.' }
      - name: Verify Windows signatures
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $paths = @('src-tauri/target/release/mokidown.exe')
          foreach ($bundle in @(
            @{ Directory = 'src-tauri/target/release/bundle/nsis'; Filter = 'mokidown_*_x64-setup.exe' },
            @{ Directory = 'src-tauri/target/release/bundle/msi'; Filter = 'mokidown_*_x64_en-US.msi' },
            @{ Directory = 'src-tauri/target/release/bundle/react'; Filter = 'MokiDown_*_x64-setup.exe' }
          )) {
            $artifacts = @(Get-ChildItem -LiteralPath $bundle.Directory -Filter $bundle.Filter -File)
            if ($artifacts.Count -ne 1) { throw "Expected exactly one artifact in $($bundle.Directory), found $($artifacts.Count)." }
            $paths += $artifacts[0].FullName
          }
          foreach ($path in $paths) {
            if (!(Test-Path -LiteralPath $path)) { throw "Release artifact missing: $path" }
          }
          # 没配证书就是未签名发布，产物存在性上面已经确认过了，这里没必要再报错。
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Warning '未配置代码签名证书，跳过 Authenticode 校验。'
            Write-Output '::warning title=跳过签名校验::本次为未签名发布。'
            exit 0
          }
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature on $path`: $($signature.Status)" }
          }
      - name: Upload React installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/react' -Filter '*.exe' -File
          gh release upload "v$version" $installer.FullName --repo '${{ github.repository }}' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'React installer upload failed.' }

  # 构建完成后，把更新包与 latest.json 同步到阿里云 OSS。
  # 客户端读的是 OSS 上那份 latest.json（见 tauri.conf.json 的 updater.endpoints），
  # GitHub Release 这边作为源与备份保留。
  # 需要先在仓库里配置：
  #   Secrets   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（建议用只授权该 Bucket 的 RAM 子账号）
  #   Variables OSS_BUCKET（如 mokidown-updates）、OSS_REGION（如 cn-hangzhou）
  sync-oss:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tag 统一从 tauri.conf.json 的版本推出：tauri-action 就是用 __VERSION__ 建 tag 的，
      # 这样 push tag 和手动触发（此时 github.ref_name 是分支名）走的是同一套逻辑。
      - name: 解析版本与 tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION} → tag v${VERSION}"

      - name: 下载 Release 附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.meta.outputs.tag }}" -D dist --repo "${{ github.repository }}"
          ls -lh dist

      - name: 生成指向 OSS 的 latest.json
        env:
          BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          cd dist
          # 对外给出的地址一律用传输加速域名：很多用户挂着代理，地域域名
          # （oss-cn-*）在他们那儿经常连不上或很慢。加速域名与地域域名指向
          # 同一个 Bucket，所以这里只影响「我们公布出去的 URL」，不必重新上传。
          # 注意上传本身仍走地域域名（见「上传到 OSS」），那是 CI 到 Bucket 的通道。
          HOST="${BUCKET}.oss-accelerate.aliyuncs.com"
          # Tauri 2 的 NSIS 更新产物就是安装包本身加一个同名 .sig，
          # 不是某些旧文档里写的 .nsis.zip（本地构建验证过：只有 .exe 和 .exe.sig）。
          PKG=$(ls mokidown_*-setup.exe | head -1)
          if [ -z "$PKG" ]; then echo "::error::没找到 NSIS 安装包（*-setup.exe）"; exit 1; fi
          if [ ! -f "${PKG}.sig" ]; then echo "::error::缺少签名文件 ${PKG}.sig，检查 createUpdaterArtifacts"; exit 1; fi
          SIG=$(cat "${PKG}.sig")
          VERSION="${{ steps.meta.outputs.version }}"
          jq -n \
            --arg v "$VERSION" \
            --arg sig "$SIG" \
            --arg url "https://${HOST}/updates/${PKG}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, notes: "", pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > latest.json
          echo "PKG=${PKG}" >> "$GITHUB_ENV"
          cat latest.json

      - name: 安装 ossutil
        run: |
          set -euo pipefail
          curl -sSL -o ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -q ossutil.zip
          find . -name 'ossutil64' -type f -exec mv {} /usr/local/bin/ossutil64 \;
          chmod +x /usr/local/bin/ossutil64
          ossutil64 --version

      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          BUCKET: ${{ vars.OSS_BUCKET }}
          REGION: ${{ vars.OSS_REGION }}
        run: |
          set -euo pipefail
          ENDPOINT="oss-${REGION}.aliyuncs.com"
          # ossutil 不读 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 这类环境变量，
          # 只认命令行参数或配置文件；不显式给凭据会报
          # "accessKeyID and ecsUrl are both empty"。这里先写一份临时配置，
          # 后面每条命令就不必重复传 -i/-k（配置落在 runner 的家目录，随环境销毁）。
          ossutil64 config -e "$ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH > /dev/null
          # 顺序很重要：先传更新包与签名，最后才传 latest.json。
          # 反过来的话，客户端可能先读到新版本号，却还下载不到对应的包。
          ossutil64 cp "dist/${PKG}" "oss://${BUCKET}/updates/${PKG}" --update --force
          ossutil64 cp "dist/${PKG}.sig" "oss://${BUCKET}/updates/${PKG}.sig" --update --force
          # latest.json 要禁缓存，否则客户端可能长时间看不到新版本。
          ossutil64 cp dist/latest.json "oss://${BUCKET}/updates/latest.json" \
            --meta "Cache-Control:no-cache" --force

      - name: 验证可匿名下载
        env:
          BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          set -euo pipefail
          # 验证客户端真正会访问的那个域名（加速域名），地域域名只是上传通道。
          HOST="${BUCKET}.oss-accelerate.aliyuncs.com"
          URL="https://${HOST}/updates/latest.json"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          echo "$URL -> $CODE"
          # 403 基本就是 Bucket 读写权限没设成公共读。
          [ "$CODE" = "200" ] || {
            echo "::error::latest.json 无法匿名访问（$CODE），请确认 Bucket 读写权限为「公共读」";
            exit 1;
          }
          PKG_URL=$(curl -s "$URL" | jq -r '.platforms["windows-x86_64"].url')
          # 必须真的挂在加速域名上。只断言字段存在是不够的——地址还指着地域
          # 域名的话，等于只加速了 679 B 的元数据，22 MB 的包依旧走慢的那条路。
          # 这里只做「含加速域名」的包含判断，故意不写复杂通配，避免自检本身出错。
          case "$PKG_URL" in
            *oss-accelerate.aliyuncs.com*) ;;
            *) echo "::error::latest.json 里的下载地址没走加速域名：$PKG_URL"; exit 1 ;;
          esac
          # 只取首字节，别在 CI 里真下 22 MB；范围请求返回 206，一并接受。
          PKG_CODE=$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 "$PKG_URL")
          echo "$PKG_URL -> $PKG_CODE"
          case "$PKG_CODE" in
            200 | 206) ;;
            *) echo "::error::安装包无法匿名下载（$PKG_CODE）：$PKG_URL"; exit 1 ;;
          esac
          echo "latest.json 与安装包均可匿名下载，OSS 同步完成。"
