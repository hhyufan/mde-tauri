name: Release Windows

# 两种触发方式，各自的坑：
#
#   push tag 'v*' —— GitHub 用的是「被推送的那个 tag 指向的提交」里的这份工作流文件，
#                    不是分支上最新的那份。所以 tag 打在旧提交上时，改 main 也不会让
#                    这次发布用上新定义（现象就是"工作流未更新"）。
#                    → 发版时把 tag 打在包含目标工作流的提交上。
#   workflow_dispatch —— 手动触发时要选 main（或含目标工作流的 ref）。
#                    默认分支之外的分支上跑，用的同样是那个 ref 自己的工作流。
#
# 另外注意 release.yml 只负责出包与发布；日常 CI 是 ci.yml（on: push / pull_request）。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --legacy-peer-deps
      - run: npm run version:sync
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Configure Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            # 没有代码签名证书也允许发布：安装包依旧带 Tauri 的更新签名
            # （那个用于校验更新包完整性，是另一回事），只是 Windows 安装时会提示
            # "未知发布者"。把这两个 secret 配上就会自动启用签名。
            Write-Warning '未配置 WINDOWS_CERTIFICATE，本次以未签名状态发布。'
            Write-Output '::warning title=未配置代码签名证书::安装包将以未签名状态发布，Windows 会提示“未知发布者”。'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mokidown-code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item -LiteralPath $pfxPath -ErrorAction SilentlyContinue
          }
          if (!$certificate -or !$certificate.HasPrivateKey -or $certificate.NotAfter -le (Get-Date)) {
            throw 'The imported code-signing certificate is missing its private key or has expired.'
          }
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          if (!($certificate.EnhancedKeyUsageList | Where-Object { $_.Value -eq $codeSigningOid })) {
            throw 'The imported certificate is not valid for code signing.'
          }
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Compress -Depth 6
          "TAURI_CONFIG=$overlay" >> $env:GITHUB_ENV
      - name: Build the single branded installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-react-installer.mjs
      - name: Sign React installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { exit 0 }
          $config = $env:TAURI_CONFIG | ConvertFrom-Json
          $thumbprint = $config.bundle.windows.certificateThumbprint
          if (!$thumbprint) { throw 'Missing Windows signing certificate thumbprint.' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'signtool.exe not found.' }
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/react/MokiDown_${version}_x64-setup.exe"
          if (@($installer).Count -ne 1) { throw 'Expected one React installer.' }
          & $signTool.FullName sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'React installer signing failed.' }
      - name: 用更新器密钥签名 React 安装器
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 必须排在 Authenticode 签名之后：给 PE 加签名会改动文件字节，
          # 先算 minisign 的话哈希就对不上，客户端下载完会验签失败。
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw '缺少 TAURI_SIGNING_PRIVATE_KEY，无法产出更新签名。' }
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/react/MokiDown_${version}_x64-setup.exe"
          if (@($installer).Count -ne 1) { throw "Expected exactly one React installer, found $(@($installer).Count)." }
          npm run tauri -- signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'React installer minisign signing failed.' }
          $sig = "$($installer.FullName).sig"
          if (!(Test-Path -LiteralPath $sig)) { throw "缺少 minisign 签名文件：$sig" }
          Write-Output "已生成 minisign 签名：$sig"
      - name: Create GitHub update manifest
        run: node scripts/create-update-manifest.mjs
      - name: Keep signed installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-react-installer
          path: src-tauri/target/release/bundle/react/
          if-no-files-found: error
      - name: Publish the installer and update manifest together
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $directory = 'src-tauri/target/release/bundle/react'
          $setup = Join-Path $directory "MokiDown_${version}_x64-setup.exe"
          $signature = "$setup.sig"
          $manifest = Join-Path $directory 'latest.json'
          foreach ($file in @($setup, $signature, $manifest)) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing release artifact: $file" }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MokiDown $tag" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          # 重跑发布时同名资产已存在，必须先删掉再传。
          #
          # 这里不能图省事用 `gh release upload --clobber`：它是「先 DELETE 再 POST」，
          # 两个请求之间不等 GitHub 端把删除反映出来，紧接着的同名上传就会撞
          # `422 ReleaseAsset.name already exists`，把整次发布打断。
          # 所以逐个资产显式删除，再轮询确认它真的从资产列表里消失，然后才上传。
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')

          function Get-ReleaseAssets {
            return @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          }

          foreach ($file in @($setup, $signature, $manifest)) {
            # 不要写 Split-Path -LiteralPath $file -Leaf：-LiteralPath 只属于 ParentSet，
            # 不含 -Leaf，运行时会报 "Parameter set cannot be resolved"（踩过一次，
            # 而且这是参数绑定错误、语法解析查不出来）。.NET 取文件名精确且不解释通配符。
            $name = [System.IO.Path]::GetFileName($file)
            # 冲突判定必须不区分大小写：GitHub 对 release 资产名的唯一性判定本身就
            # 不区分大小写。列表里存在小写的 mokidown_0.1.3_x64-setup.exe 时，上传
            # 大写的 MokiDown_0.1.3_x64-setup.exe 会直接
            # `422 ReleaseAsset.name already exists`（已用全大写探针实测确认）。
            # 所以这里要按列表里的「原名」把小写那份删掉，而不是跳过上传。
            $lower = $name.ToLowerInvariant()
            foreach ($existing in @($assets | Where-Object { $_.ToLowerInvariant() -eq $lower })) {
              Write-Output "命名冲突（大小写不同也算同名），先删除已有资产：$existing"
              gh release delete-asset $tag $existing --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not delete existing asset: $existing" }
              $removed = $false
              for ($attempt = 0; $attempt -lt 20 -and -not $removed; $attempt++) {
                Start-Sleep -Milliseconds 500
                $removed = -not ((Get-ReleaseAssets) -contains $existing)
              }
              if (-not $removed) { throw "Asset $existing still listed after deletion." }
            }
          }
          gh release upload $tag $setup $signature $manifest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer and manifest.' }
          # 终态校验：这一步曾经「绿着但包没上去」（被不区分大小写的重复检查静默跳过），
          # 所以上传完必须确认三个资产真的都在列表里。
          $uploaded = Get-ReleaseAssets
          foreach ($file in @($setup, $signature, $manifest)) {
            $name = [System.IO.Path]::GetFileName($file)
            if (-not ($uploaded -ccontains $name)) { throw "上传后资产不在列表中：$name" }
          }
          Write-Output "已上传并确认：$(($uploaded | Where-Object { $_ -like 'MokiDown_*' -or $_ -eq 'latest.json' }) -join ', ')"
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }

  # 把同一个已签名安装器与更新清单镜像到 OSS。
  #
  # 客户端 endpoint 顺序是 [OSS 地域, OSS 加速, GitHub]：国内先走 OSS（快且稳），
  # OSS 走不通会自动退到 GitHub，三个都不通才报错——这是 tauri-plugin-updater
  # 的 endpoint 循环语义（成功即 break，只有全部失败才返回错误），所以
  # “走不通不报错”不需要客户端改代码，只要把顺序排成这样。
  sync-oss:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tag 统一从 tauri.conf.json 版本推出，与 windows 任务保持一致；
      # 手动触发时 github.ref_name 是分支名，不能拿来当 tag。
      - name: 解析版本与 tag
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION} → tag v${VERSION}"

      - name: 取回已签名的安装器与签名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 只取 React 安装器与它的 minisign 签名：它既是更新载荷，也是 Release
          # 页面上供人手动安装的那一个，两边必须是同一份字节。
          gh release download "${{ steps.meta.outputs.tag }}" -D dist --repo "${{ github.repository }}" \
            --pattern "MokiDown_${{ steps.meta.outputs.version }}_x64-setup.exe" \
            --pattern "MokiDown_${{ steps.meta.outputs.version }}_x64-setup.exe.sig"
          ls -lh dist

      - name: 生成指向 OSS 的 latest.json
        env:
          BUCKET: ${{ vars.OSS_BUCKET }}
          REGION: ${{ vars.OSS_REGION }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          # 复用 create-update-manifest.mjs 里的 releaseManifest()（有单测覆盖），
          # 只把下载基址换成 OSS，不再另写一份 jq 逻辑——两份实现迟早会漂移。
          node scripts/create-update-manifest.mjs \
            --oss-base="https://${BUCKET}.oss-${REGION}.aliyuncs.com/updates" \
            --sig="dist/MokiDown_${VERSION}_x64-setup.exe.sig" \
            --out=dist/latest.json
          cat dist/latest.json

      - name: 安装 ossutil
        run: |
          set -euo pipefail
          curl -sSL -o ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip -q ossutil.zip
          find . -name 'ossutil64' -type f -exec mv {} /usr/local/bin/ossutil64 \;
          chmod +x /usr/local/bin/ossutil64
          ossutil64 --version

      - name: 上传到 OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          BUCKET: ${{ vars.OSS_BUCKET }}
          REGION: ${{ vars.OSS_REGION }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          ENDPOINT="oss-${REGION}.aliyuncs.com"
          # ossutil 不读 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 这类环境变量，
          # 只认命令行参数或配置文件；不显式给凭据会报
          # "accessKeyID and ecsUrl are both empty"。这里先写一份临时配置，
          # 后面每条命令就不必重复传 -i/-k（配置落在 runner 家目录，随环境销毁）。
          ossutil64 config -e "$ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH > /dev/null
          PKG="MokiDown_${VERSION}_x64-setup.exe"
          # 顺序很重要：先传更新包与签名，最后才传 latest.json。
          # 反过来的话，客户端可能先读到新版本号，却还下载不到对应的包。
          ossutil64 cp "dist/${PKG}" "oss://${BUCKET}/updates/${PKG}" --update --force
          ossutil64 cp "dist/${PKG}.sig" "oss://${BUCKET}/updates/${PKG}.sig" --update --force
          # latest.json 要禁缓存，否则客户端可能长时间看不到新版本。
          ossutil64 cp dist/latest.json "oss://${BUCKET}/updates/latest.json" \
            --meta "Cache-Control:no-cache" --force

      - name: 验证可匿名下载
        env:
          BUCKET: ${{ vars.OSS_BUCKET }}
          REGION: ${{ vars.OSS_REGION }}
        run: |
          set -euo pipefail
          # 验证客户端真正会下载的那条路：地域域名。
          HOST="${BUCKET}.oss-${REGION}.aliyuncs.com"
          URL="https://${HOST}/updates/latest.json"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
          echo "$URL -> $CODE"
          # 403 基本就是 Bucket 读写权限没设成公共读。
          [ "$CODE" = "200" ] || {
            echo "::error::latest.json 无法匿名访问（$CODE），请确认 Bucket 读写权限为「公共读」";
            exit 1;
          }
          BODY=$(curl -s "$URL")
          PKG_URL=$(echo "$BODY" | jq -r '.platforms["windows-x86_64"].url')
          # platform.url 是单值，客户端下载时没有多地址回退，所以这里必须是
          # 一直可用的地域域名（加速域名时通时不通，只做第二候选）。
          case "$PKG_URL" in
            *"oss-${REGION}.aliyuncs.com"*) ;;
            *) echo "::error::latest.json 的下载地址不是地域域名：$PKG_URL"; exit 1 ;;
          esac
          # 必须指向大写的 React 安装器。指错成小写 NSIS 包，更新会退回系统原生界面。
          case "$PKG_URL" in
            *"/MokiDown_"*"-setup.exe") ;;
            *) echo "::error::latest.json 没有指向 React 安装器：$PKG_URL"; exit 1 ;;
          esac
          # 三个 platform 键都要在：老客户端会按自己的 bundle 类型取对应条目。
          for key in windows-x86_64 windows-x86_64-nsis windows-x86_64-msi; do
            echo "$BODY" | jq -e ".platforms[\"$key\"].url" > /dev/null \
              || { echo "::error::latest.json 缺少 platform 键：$key"; exit 1; }
          done
          # 只取首字节，别在 CI 里真下 30 MB；范围请求返回 206，一并接受。
          PKG_CODE=$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 "$PKG_URL")
          echo "$PKG_URL -> $PKG_CODE"
          case "$PKG_CODE" in
            200 | 206) ;;
            *) echo "::error::安装包无法匿名下载（$PKG_CODE）：$PKG_URL"; exit 1 ;;
          esac
          # endpoint 顺序本身就是行为约定（OSS 优先、GitHub 兜底），这里静态断言，
          # 免得以后有人调整配置把国内又推回 GitHub。
          FIRST=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.endpoints[0]")
          LAST=$(node -p "const e=require('./src-tauri/tauri.conf.json').plugins.updater.endpoints; e[e.length-1]")
          case "$FIRST" in
            *aliyuncs.com*) ;;
            *) echo "::error::第一个 endpoint 不是 OSS，国内会先走 GitHub：$FIRST"; exit 1 ;;
          esac
          case "$LAST" in
            *github.com*) ;;
            *) echo "::error::最后一个 endpoint 不是 GitHub，缺兜底：$LAST"; exit 1 ;;
          esac
          # 加速域名只作为 endpoints 的第二候选，时通时不通属于已知情况，
          # 所以这里只提示、不判失败——免得它把整次发布拦下来。
          ACCEL="https://${BUCKET}.oss-accelerate.aliyuncs.com/updates/latest.json"
          ACCEL_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$ACCEL" || echo 000)
          echo "加速域名（仅参考，不作判据）: $ACCEL -> $ACCEL_CODE"
          if [ "$ACCEL_CODE" != "200" ]; then
            echo "::warning title=加速域名不可达::${ACCEL} 返回 ${ACCEL_CODE}，客户端会继续退到下一候选。"
          fi
          echo "OSS 镜像完成：latest.json 与安装包均可匿名下载。"
