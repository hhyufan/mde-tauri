name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --legacy-peer-deps
      - run: npm run version:sync
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Configure Windows code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            # 没有代码签名证书也允许发布：安装包依旧带 Tauri 的更新签名
            # （那个用于校验更新包完整性，是另一回事），只是 Windows 安装时会提示
            # "未知发布者"。把这两个 secret 配上就会自动启用签名。
            Write-Warning '未配置 WINDOWS_CERTIFICATE，本次以未签名状态发布。'
            Write-Output '::warning title=未配置代码签名证书::安装包将以未签名状态发布，Windows 会提示“未知发布者”。'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'mokidown-code-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          } finally {
            Remove-Item -LiteralPath $pfxPath -ErrorAction SilentlyContinue
          }
          if (!$certificate -or !$certificate.HasPrivateKey -or $certificate.NotAfter -le (Get-Date)) {
            throw 'The imported code-signing certificate is missing its private key or has expired.'
          }
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          if (!($certificate.EnhancedKeyUsageList | Where-Object { $_.Value -eq $codeSigningOid })) {
            throw 'The imported certificate is not valid for code signing.'
          }
          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Compress -Depth 6
          "TAURI_CONFIG=$overlay" >> $env:GITHUB_ENV
      - name: Build the single branded installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-react-installer.mjs
      - name: Sign React installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { exit 0 }
          $config = $env:TAURI_CONFIG | ConvertFrom-Json
          $thumbprint = $config.bundle.windows.certificateThumbprint
          if (!$thumbprint) { throw 'Missing Windows signing certificate thumbprint.' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'signtool.exe not found.' }
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/react/MokiDown_${version}_x64-setup.exe"
          if (@($installer).Count -ne 1) { throw 'Expected one React installer.' }
          & $signTool.FullName sign /sha1 $thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'React installer signing failed.' }
      - name: 用更新器密钥签名 React 安装器
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 必须排在 Authenticode 签名之后：给 PE 加签名会改动文件字节，
          # 先算 minisign 的话哈希就对不上，客户端下载完会验签失败。
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw '缺少 TAURI_SIGNING_PRIVATE_KEY，无法产出更新签名。' }
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "src-tauri/target/release/bundle/react/MokiDown_${version}_x64-setup.exe"
          if (@($installer).Count -ne 1) { throw "Expected exactly one React installer, found $(@($installer).Count)." }
          npm run tauri -- signer sign $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'React installer minisign signing failed.' }
          $sig = "$($installer.FullName).sig"
          if (!(Test-Path -LiteralPath $sig)) { throw "缺少 minisign 签名文件：$sig" }
          Write-Output "已生成 minisign 签名：$sig"
      - name: Create GitHub update manifest
        run: node scripts/create-update-manifest.mjs
      - name: Keep signed installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-react-installer
          path: src-tauri/target/release/bundle/react/
          if-no-files-found: error
      - name: Publish the installer and update manifest together
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $directory = 'src-tauri/target/release/bundle/react'
          $setup = Join-Path $directory "MokiDown_${version}_x64-setup.exe"
          $signature = "$setup.sig"
          $manifest = Join-Path $directory 'latest.json'
          foreach ($file in @($setup, $signature, $manifest)) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing release artifact: $file" }
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MokiDown $tag" --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          # 重跑发布时同名资产已存在，必须先删掉再传。
          #
          # 这里不能图省事用 `gh release upload --clobber`：它是「先 DELETE 再 POST」，
          # 两个请求之间不等 GitHub 端把删除反映出来，紧接着的同名上传就会撞
          # `422 ReleaseAsset.name already exists`，把整次发布打断。
          # 所以逐个资产显式删除，再轮询确认它真的从资产列表里消失，然后才上传。
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach ($file in @($setup, $signature, $manifest)) {
            $name = Split-Path -LiteralPath $file -Leaf
            # 用 -ccontains：PowerShell 的 -contains 不区分大小写，而资产名里
            # MokiDown_（React 安装器）与 mokidown_（旧 NSIS 包）只差大小写，
            # 用错会误判成另一个文件已存在。
            if ($assets -ccontains $name) {
              gh release delete-asset $tag $name --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not delete existing asset: $name" }
              $removed = $false
              for ($attempt = 0; $attempt -lt 20 -and -not $removed; $attempt++) {
                Start-Sleep -Milliseconds 500
                $current = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
                $removed = -not ($current -ccontains $name)
              }
              if (-not $removed) { throw "Asset $name still listed after deletion." }
            }
          }
          gh release upload $tag $setup $signature $manifest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer and manifest.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
